# Cross-play test: the published web game (branch main) and the PC build race each other through a local MQTT broker
# (tools/mqtt_broker.py), both ways round: the browser hosts and the PC joins, then the PC hosts and the browser joins.
# Runs when the cross-play code changes, or by hand.
name: Cross-play test

on:
  push:
    branches: [godot]
    paths: [scripts/webnet.gd, scripts/mqtt.gd, tests/xplay.gd, tools/xplay_test.py, tools/mqtt_broker.py, .github/workflows/xplay.yml]
  workflow_dispatch:

jobs:
  xplay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dir: [web-hosts, pc-hosts]
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: pc
      - uses: actions/checkout@v4
        with:
          ref: main
          path: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser and Godot
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" pc/godot && chmod +x pc/godot
      - name: Hawaiian Bay and the garage (the "maps" release)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: pc
        run: |
          mkdir -p maps && touch maps/.gdignore
          gh release download maps -R "$GITHUB_REPOSITORY" -p 'map-bay.zip' -D "$RUNNER_TEMP/m" && unzip -q -o "$RUNNER_TEMP/m/map-bay.zip" -d maps
          gh release download maps -R "$GITHUB_REPOSITORY" -p 'garage.zip' -D "$RUNNER_TEMP/g" && mkdir -p assets && unzip -q -o "$RUNNER_TEMP/g/garage.zip" -d assets
          # the WebRTC add-on, as the PC build fetches it: the two copies then race over a direct link
          curl -fsSL -o "$RUNNER_TEMP/webrtc.zip" "https://github.com/godotengine/webrtc-native/releases/download/1.2.2-stable/godot-extension-webrtc_native.zip" \
            && echo "98e9446921740d995bd9ca1be48798dc3c2ceed51e044a25ce18b3cff11f56e5  $RUNNER_TEMP/webrtc.zip" | sha256sum -c - \
            && unzip -q -o "$RUNNER_TEMP/webrtc.zip" -d . || echo "::warning::WebRTC add-on not fetched"
          ./godot --headless --path . --import > import.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi
      - name: Race (${{ matrix.dir }})
        working-directory: pc
        run: |
          python3 tools/mqtt_broker.py 8765 > broker.log 2>&1 &
          sleep 1
          ROLE=${{ matrix.dir == 'web-hosts' && 'host' || 'join' }}
          XROLE=${{ matrix.dir == 'web-hosts' && 'join' || 'host' }}
          (WEB=../web ROOM_FILE=room.txt BROKER=ws://127.0.0.1:8765/mqtt MI=1 ROLE=$ROLE timeout 3000 python3 tools/xplay_test.py > web.log 2>&1; echo "web exit $?" >> web.log) &
          CR_MAP=bay CR_XDUMP=xdump.jsonl CR_BROKERS=ws://127.0.0.1:8765/mqtt CR_ROOM_FILE=room.txt CR_XROLE=$XROLE timeout 3000 ./godot --headless --path . res://tests/xplay.tscn > pc.log 2>&1 || true
          for i in $(seq 1 120); do grep -q "web exit" web.log && break; sleep 2; done
          echo "---- browser"; grep -E "XPLAY|Error|Traceback|exit" web.log | tail -60
          echo "---- PC"; grep -E "^XPLAY|SCRIPT ERROR|   at: " pc.log | tail -60
          echo "---- route"; grep -E "^WEBNET direct" pc.log || echo "no direct link: the race ran on the relay"
          grep -q "XPLAY WEB PASS" web.log && grep -q "XPLAY PC PASS" pc.log
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xplay-${{ matrix.dir }}
          path: |
            pc/web.log
            pc/pc.log
            pc/xdump.jsonl
          if-no-files-found: ignore
