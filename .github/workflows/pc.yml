# Checks and builds the PC version on every push: imports the project, drives the full race
# headless, renders screenshots with a software GPU, and exports a ready-to-run Windows build.
name: PC build

on:
  push:
    branches: [godot]
    paths-ignore: [tools/hd_fetch.py, tools/hdlist.py, tools/hd_textures.py, .github/workflows/hd.yml, .github/workflows/maps.yml, .github/workflows/scenery.yml, tests/scenery.txt, tests/scenery.gd, tests/scenery.tscn, README.md, .github/workflows/xplay.yml, tools/xplay_test.py, tools/mqtt_broker.py, tests/xplay.gd, tests/xplay.tscn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and its export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv templates/* "$dest/"

      - name: Fetch the tracks and the garage (the "maps" release, made by the Export tracks workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p maps && touch maps/.gdignore
          if gh release view maps -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download maps -R "$GITHUB_REPOSITORY" -p 'map-*.zip' -D "$RUNNER_TEMP/maps_zip" || true
            for z in "$RUNNER_TEMP"/maps_zip/*.zip; do [ -f "$z" ] && unzip -q -o "$z" -d maps; done
          fi
          ls maps; du -sh maps
          # the garage's bodies, wheels, gliders and drivers (imported with the project)
          if gh release download maps -R "$GITHUB_REPOSITORY" -p 'garage.zip' -D "$RUNNER_TEMP/garage_zip"; then
            mkdir -p assets && unzip -q -o "$RUNNER_TEMP/garage_zip/garage.zip" -d assets
          fi
          ls assets/garage | wc -l || true
          # the soundtrack, rendered from the web game's music (tools/cimusic.py)
          if gh release download maps -R "$GITHUB_REPOSITORY" -p 'music.zip' -D "$RUNNER_TEMP/music_zip"; then
            mkdir -p assets && unzip -q -o "$RUNNER_TEMP/music_zip/music.zip" -d assets
          fi
          ls assets/music | wc -l || true
          # the CC0 textures for the finished scenery (tools/hd_fetch.py)
          if gh release download maps -R "$GITHUB_REPOSITORY" -p 'hd.zip' -D "$RUNNER_TEMP/hd_zip"; then
            mkdir -p assets/hd/cc0 && unzip -q -o -j "$RUNNER_TEMP/hd_zip/hd.zip" -d assets/hd/cc0
          fi
          ls assets/hd/cc0 | wc -l || true
          # the finished ground: relief and gloss maps made from each track's own ground picture (tools/hd_ground.py)
          python3 -c "import numpy, PIL" 2> /dev/null || pip install -q --break-system-packages numpy pillow || pip install -q numpy pillow || true
          python3 tools/hd_ground.py maps || echo "::warning::ground maps not made"

      - name: The WebRTC add-on (direct links to the browser game; without it online play stays on the relay)
        run: |
          # godotengine/webrtc-native (MIT), on libdatachannel (MPL-2.0); checked against its known checksum
          url="https://github.com/godotengine/webrtc-native/releases/download/1.2.2-stable/godot-extension-webrtc_native.zip"
          if curl -fsSL -o "$RUNNER_TEMP/webrtc.zip" "$url" \
            && echo "98e9446921740d995bd9ca1be48798dc3c2ceed51e044a25ce18b3cff11f56e5  $RUNNER_TEMP/webrtc.zip" | sha256sum -c -; then
            unzip -q -o "$RUNNER_TEMP/webrtc.zip" -d . && ls addons/webrtc_native
          else
            echo "::warning::WebRTC add-on not fetched: online play will use the relay only"
          fi

      - name: Import the project
        run: |
          ./godot --headless --path . --import 2>&1 | tee import.log | tail -60
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" import.log; then echo "::error::script errors"; exit 1; fi

      - name: Drive the race (headless)
        run: |
          timeout 1200 ./godot --headless --path . --fixed-fps 120 res://tests/smoke.tscn 2>&1 | tee smoke.log | grep -v "^SHOT_PART" | tail -80 || true
          if grep -E "SCRIPT ERROR|Parse Error" smoke.log; then echo "::error::runtime script errors"; exit 1; fi
          grep -q "SMOKE PASS" smoke.log

      - name: Drive every track (headless)
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
        continue-on-error: true
        run: |
          timeout 1500 ./godot --headless --path . res://tests/allmaps.tscn 2>&1 | tee maps.log | grep -E "^MAP|SCRIPT ERROR|Parse Error|   at: |ERROR" | head -80 || true
          grep -q "MAPS PASS" maps.log

      - name: Online race between two copies of the game
        continue-on-error: true
        run: |
          (timeout 240 ./godot --headless --path . res://tests/net.tscn -- host > net_host.log 2>&1 &)
          sleep 4
          timeout 240 ./godot --headless --path . res://tests/net.tscn -- join > net_join.log 2>&1 || true
          for i in $(seq 1 30); do grep -q "NET HOST \(PASS\|FAIL\)" net_host.log && break; sleep 2; done
          grep -E "^NET|SCRIPT ERROR|Parse Error|   at: " net_host.log | head -30
          grep -E "^NET|SCRIPT ERROR|Parse Error|   at: " net_join.log | head -30
          grep -q "NET HOST PASS" net_host.log
          grep -q "NET CLIENT PASS" net_join.log

      - name: Screenshots (software Vulkan)
        if: ${{ always() && !contains(github.event.head_commit.message, '[quick]') }}
        # pictures for checking only: an outage of the Ubuntu package mirrors (it happens) mustn't hold back the download
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb > /dev/null
          mkdir -p build/shots
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./godot --path . --rendering-driver vulkan --resolution 1280x720 --fixed-fps 60 res://tests/shots.tscn > shots.log 2>&1 || true
          grep -v "^SHOT_PART" shots.log | tail -40
          if ! ls build/shots/*.png > /dev/null 2>&1; then
            echo "Vulkan produced no shots; trying the OpenGL renderer"
            timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1280x720 res://tests/shots.tscn > shots.log 2>&1 || true
            grep -v "^SHOT_PART" shots.log | tail -40
          fi
          grep "^SHOT_PART" shots.log || true
          ls -la build/shots || true

      - name: Export the Windows build
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
        run: |
          set -euo pipefail
          mkdir -p build/windows
          # the build's stamp, shown in the corner of the title screen and on F3
          echo "{\"build\": \"${GITHUB_SHA::8}\", \"date\": \"$(date -u +%Y-%m-%d)\"}" > assets/build.json
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/CrustRush.exe 2>&1 | tail -30
          # the tracks go in a "maps" folder next to the game
          if ls maps/*/ > /dev/null 2>&1; then cp -r maps build/windows/maps; rm -f build/windows/maps/.gdignore; fi
          # the WebRTC add-on's licences go with its library
          if ls addons/webrtc_native/LICENSE.* > /dev/null 2>&1; then
            mkdir -p build/windows/licenses && cp addons/webrtc_native/LICENSE.* build/windows/licenses/
          fi
          ls -la build/windows; du -sh build/windows

      # the public download (the "pc" release, linked from the download page): replaced on every full build
      - name: Publish the download
        if: ${{ github.ref == 'refs/heads/godot' && !contains(github.event.head_commit.message, '[quick]') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd build && mv windows CrustRush && zip -q -r -6 ../CrustRush-Windows.zip CrustRush && mv CrustRush windows)
          size=$(stat -c %s CrustRush-Windows.zip); echo "zip: $((size / 1048576)) MB"
          if [ "$size" -gt 2040109465 ]; then echo "::error::the zip is over GitHub's 2 GB release limit"; exit 1; fi
          gh release view pc -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create pc -R "$GITHUB_REPOSITORY" --target godot --title "Crust Rush for Windows" \
              --notes "The PC version of Crust Rush. Download CrustRush-Windows.zip, unzip it anywhere and run CrustRush.exe. Updated automatically from the godot branch."
          # GitHub's upload sometimes answers 502 (the old file is already gone by then): try again, up to three times
          up() { for i in 1 2 3; do gh release upload pc -R "$GITHUB_REPOSITORY" --clobber "$1" && return 0; echo "upload of $1 failed, trying again"; sleep 20; done; return 1; }
          up CrustRush-Windows.zip
          echo "{\"build\": \"${GITHUB_SHA::8}\", \"date\": \"$(date -u +%Y-%m-%d)\", \"bytes\": $size}" > pc-build.json
          up pc-build.json

      - uses: actions/upload-artifact@v4
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
        with:
          name: CrustRush-Windows
          path: build/windows/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !contains(github.event.head_commit.message, '[quick]') }}
        with:
          name: screenshots
          path: build/shots
          retention-days: 14
