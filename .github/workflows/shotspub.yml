# Collects the pictures a "Track pictures" run made into one zip on a scratch pre-release (shots-tmp), so they can
# be fetched and the best ones picked. Runs when .github/shotspub.txt changes: its first word is the run number, or
# the word delete to remove the scratch release.
name: Track pictures zip

on:
  push:
    branches: [godot]
    paths: [.github/shotspub.txt]

permissions:
  contents: write
  actions: read

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - id: req
        run: echo "run=$(awk '{print $1; exit}' .github/shotspub.txt)" >> "$GITHUB_OUTPUT"
      - name: Remove the scratch release
        if: steps.req.outputs.run == 'delete'
        run: gh release delete shots-tmp --yes --cleanup-tag || true
      - uses: actions/download-artifact@v4
        if: steps.req.outputs.run != 'delete'
        with:
          run-id: ${{ steps.req.outputs.run }}
          github-token: ${{ github.token }}
          path: shots
          merge-multiple: true
      - name: Publish the zip
        if: steps.req.outputs.run != 'delete'
        run: |
          ls shots | wc -l
          (cd shots && zip -q -r ../shots.zip .)
          gh release view shots-tmp > /dev/null 2>&1 || gh release create shots-tmp --prerelease --target godot --title "Track pictures (scratch)" --notes "Scratch files for picking the menu pictures. Not a game release."
          gh release upload shots-tmp shots.zip --clobber
